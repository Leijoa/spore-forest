<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>孢子森林｜蘑菇增量遊戲</title>
<meta name="description" content="點蘑菇收集孢子，養出小屋、村莊、聚落與城堡的可愛增量遊戲。">
<meta name="theme-color" content="#243d31">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="孢子森林">
<meta property="og:title" content="孢子森林">
<meta property="og:description" content="點蘑菇收集孢子，養出小屋、村莊、聚落與城堡的可愛增量遊戲。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍄%3C/text%3E%3C/svg%3E">
<style>
:root{--moss:#243d31;--moss2:#2f5040;--lichen:#dfe8cf;--spore:#f2c14e;--lilac:#b79ad9;--cap:#c8463a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{touch-action:manipulation;overscroll-behavior:none}
.stage,#shroom,#golden{touch-action:none}
svg{pointer-events:none}
body{margin:0;background:radial-gradient(circle at 50% 20%,#35604b,var(--moss) 60%);color:var(--lichen);font-family:"Noto Serif TC","PingFang TC",serif;min-height:100vh;user-select:none;overflow-x:hidden;transition:background 1s}
body.evt-dance{background:radial-gradient(circle at 50% 20%,#4a3f78,#2a2a4a 62%)}
body.evt-camp{background:radial-gradient(circle at 50% 70%,#6b4a2a,#2d3a24 62%)}
body.evt-market{background:radial-gradient(circle at 50% 20%,#4f6b3a,#2f4a34 62%)}
body.evt-fest{background:radial-gradient(circle at 50% 20%,#2c3e6b,#141c38 72%)}
body.evt-parade{background:radial-gradient(circle at 50% 20%,#6b5a2a,#3a3a24 62%)}
body.frenzy{background:radial-gradient(circle at 50% 20%,#6b5a2a,#2d3a24 60%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.wrap{max-width:460px;margin:auto;padding:16px;position:relative;z-index:2}
.wrap.shake{animation:shake .25s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,3px)}80%{transform:translate(2px,-1px)}}
.top{text-align:center}
.count{font-size:40px;font-weight:700;color:var(--spore);line-height:1.1;margin-top:6px;display:inline-block;text-shadow:0 0 18px rgba(242,193,78,.35)}
.count.pop{animation:pop .15s}
@keyframes pop{50%{transform:scale(1.12)}}
.rate{font-size:14px;opacity:.8}
.dps{display:inline-flex;gap:10px;align-items:baseline;margin-top:6px;padding:4px 12px;border-radius:14px;background:rgba(0,0,0,.2);font-size:13px}
.dps b{color:var(--spore);font-size:17px;transition:color .2s}
.dps b.hot{color:#ff7a5c}
.dps .sub{opacity:.75}
.seed{font-size:13px;color:var(--lilac);margin-top:4px;min-height:18px}
.buff{font-size:14px;color:var(--spore);min-height:20px;font-weight:700}
.stage{position:relative;height:290px;cursor:pointer;margin:0 -16px}
.tierchip{font-size:12px;line-height:1.5;padding:8px 12px;margin:8px 0;border-radius:12px;background:rgba(0,0,0,.28)}
.tierchip small{opacity:.75;font-size:11px}
.rq{display:inline-block;margin:2px 7px 0 0;font-size:10.5px;opacity:.8}
.rq.ok{color:var(--spore);opacity:1}
.tbar{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lilac),var(--spore))}
#garden{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.combo{z-index:2}
#shroom{z-index:1;position:absolute;left:50%;top:40px;margin-left:-95px;width:190px;height:190px;border:none;background:none;cursor:pointer;padding:0}
#shroom svg{transform-origin:50% 90%;transition:filter .3s}
#shroom.squash svg{animation:squash .16s ease-out}
@keyframes squash{35%{transform:scale(1.14,.84)}70%{transform:scale(.94,1.08)}}
body.frenzy #shroom svg{filter:drop-shadow(0 0 22px #f2c14e)}
#shroom{transform-origin:50% 92%;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,1.04)}}
body.evt-dance #shroom{animation:sway .52s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
body.evt-fest #shroom,body.evt-parade #shroom{animation:hopm .52s ease-in-out infinite}
@keyframes hopm{50%{transform:translateY(-6px) scale(1.02,.98)}}
.evchip{position:absolute;right:22px;top:2px;z-index:3;pointer-events:none;font-size:11.5px;padding:4px 10px;border-radius:12px;background:rgba(0,0,0,.28);transition:background .3s}
.evchip.on{background:rgba(242,193,78,.9);color:#243d31;font-weight:700}
#shroom:focus-visible{outline:2px dashed var(--spore);border-radius:50%}
.combo{position:absolute;left:0;right:0;bottom:0;text-align:center}
.combo .bar{height:6px;width:60%;margin:4px auto 0;background:rgba(0,0,0,.25);border-radius:3px;overflow:hidden}
.combo .fill{height:100%;width:0;background:linear-gradient(90deg,var(--lilac),var(--spore));transition:width .1s}
.combo .txt{font-size:13px;height:18px;color:var(--lilac)}
.float{position:fixed;pointer-events:none;color:var(--spore);font-weight:700;z-index:6;animation:up .9s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.float.crit{color:#ff7a5c;font-size:30px;animation:crit 1.1s ease-out forwards}
@keyframes up{0%{transform:translateY(0) scale(.6)}15%{transform:translateY(-10px) scale(1.15)}100%{transform:translateY(-80px) scale(1);opacity:0}}
@keyframes crit{0%{transform:scale(.3) rotate(-8deg)}20%{transform:scale(1.4) rotate(4deg)}100%{transform:translateY(-90px) scale(1);opacity:0}}
#golden{position:fixed;z-index:7;width:64px;height:64px;border:none;background:none;font-size:48px;padding:0;display:none;animation:bob 1.2s ease-in-out infinite;filter:drop-shadow(0 0 14px #ffd86b)}
@keyframes bob{50%{transform:translateY(-8px) rotate(8deg)}}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;min-width:0;min-height:44px;padding:9px 3px;border:1px solid var(--moss2);background:transparent;color:var(--lichen);border-radius:18px;font:inherit;font-size:13px;position:relative}
.tabs button.on{background:var(--lichen);color:var(--moss)}
.tabs button .dot{position:absolute;top:4px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--spore);display:none}
.tabs button .dot.show{display:block}
.album{padding:14px;background:rgba(0,0,0,.18);border-radius:18px}
.album h2{font-size:19px;margin:0 0 6px}.album p{font-size:13px;line-height:1.7}
.album-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.album-list button{min-height:100px;padding:8px 3px;border:1px solid var(--moss2);border-radius:14px;background:rgba(0,0,0,.12);color:var(--lichen);font:inherit;font-size:13px}
.album-list button[aria-pressed=true]{border-color:var(--spore);background:rgba(242,193,78,.12)}
.album-list svg{display:block;width:64px;height:64px;margin:auto}.album-list small{display:block;font-size:11px;opacity:.75}
.album button:focus-visible{outline:3px solid var(--spore);outline-offset:3px}
.portrait{display:block;position:relative;width:100%;min-height:200px;border:0;border-radius:16px;background:radial-gradient(ellipse at 50% 70%,#48624a,rgba(0,0,0,.12) 75%);color:var(--lichen);font:inherit;padding:12px;cursor:pointer}
.portrait svg{width:190px;height:190px;max-width:100%;display:block;margin:auto}
.portrait span{display:block;font-size:12px}.portrait:disabled{cursor:default}
.portrait.react svg{animation:album-wave .65s ease-in-out}
@keyframes album-wave{25%{transform:rotate(-7deg) translateY(-5px)}60%{transform:rotate(6deg)}85%{transform:rotate(-2deg)}}
.album-response{min-height:48px;margin:12px 0;color:var(--spore)}
.achievement-row{padding:12px 0;border-bottom:1px solid #60705a;font-size:13px;line-height:1.6}.achievement-row strong{display:block}.achievement-row span{color:var(--spore)}.achievement-row progress{display:block;width:100%;accent-color:var(--spore);margin-top:6px}.achievement-list summary{cursor:pointer;min-height:44px;padding:12px 0}.achievement-list summary:focus-visible{outline:3px solid var(--spore)}
.sticker-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.sticker-card{min-width:0;min-height:130px;padding:8px 4px;border:1px solid #627552;border-radius:16px;background:rgba(0,0,0,.12);color:var(--lichen);font:inherit;font-size:12px;line-height:1.5;cursor:pointer}
.sticker-card[aria-pressed=true]{border-color:var(--spore);background:rgba(242,193,78,.13)}.sticker-card small{display:block;font-size:11px;opacity:.8}
.sticker-card svg{display:block;width:100%;max-width:96px;height:auto;margin:auto}.sticker-card:focus-visible{outline:3px solid var(--spore);outline-offset:2px}
.sticker-detail{padding:16px;margin:12px 0;border:1px dashed var(--lilac);border-radius:18px;text-align:center}.sticker-detail svg{display:block;width:210px;max-width:100%;height:auto;margin:auto}.sticker-detail h3{font-size:17px;margin:10px 0 4px}.sticker-detail p{margin:6px 0}
.memory{margin-top:12px;padding:12px;border:1px dashed var(--lilac);border-radius:14px}.memory h3{font-size:15px;margin:0 0 8px}.memory svg{width:90px;height:90px;display:block;margin:auto;background:#dfe8cf;border:4px solid #f2c14e;border-radius:24px;transform:rotate(-4deg)}

.stage[data-theme=dew]{background:radial-gradient(ellipse at 50% 90%,#5b8b7255,#afd9c118 70%)}
.stage[data-theme=moon]{background:radial-gradient(ellipse at 80% 20%,#9b8bcb40,#343d6020 75%)}
.forest details{border-top:1px solid #60705a;padding:8px 0}.forest summary{min-height:44px;padding:12px 0;cursor:pointer;font-size:14px}.forest label{display:block;font-size:13px;margin:8px 0 4px}.forest select{display:block;width:100%;min-width:0;min-height:44px;border:1px solid #738469;border-radius:10px;background:#243d31;color:var(--lichen);font:inherit;font-size:13px;padding:8px}.forest select:focus-visible,.forest summary:focus-visible{outline:3px solid var(--spore)}.forest-row{border-bottom:1px dashed #60705a;padding:0 0 12px}.visitor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.visitor-grid button{min-width:0;min-height:140px;background:#243d31;color:var(--lichen);border:1px solid #738469;border-radius:14px;padding:6px;font:inherit;font-size:13px}.visitor-grid svg{display:block;width:100%;height:auto}.visitor-grid small{display:block;font-size:11px;line-height:1.5}.visitor-grid button:disabled{opacity:.7}
@media(prefers-reduced-motion:reduce){.portrait.react svg{animation:none}}

.item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;background:rgba(0,0,0,.18);border-left:4px solid var(--lilac);border-radius:4px 12px 12px 4px;transition:background .3s}
.item.flash{background:rgba(242,193,78,.35)}
.item .ico{font-size:26px;width:34px;text-align:center;display:inline-block}
.item .ico.bounce{animation:bounce .35s}
@keyframes bounce{40%{transform:translateY(-10px) scale(1.3)}}
.item .info{flex:1;font-size:13px}
.item .name{font-size:15px;font-weight:700}
.item button{padding:8px 10px;min-width:84px;border:none;border-radius:10px;background:var(--spore);color:var(--moss);font:inherit;font-weight:700;transition:transform .08s}
.item button:active{transform:scale(.92)}
.item button:disabled{background:#4a6456;color:#8fa596}
.item.locked{opacity:.45}
.prestige{margin-top:10px;padding:14px;border:1px dashed var(--lilac);border-radius:14px;font-size:14px;line-height:1.7}
.prestige button{width:100%;margin-top:8px;padding:11px;border:none;border-radius:10px;background:var(--lilac);color:var(--moss);font:inherit;font-weight:700}
.prestige button:disabled{opacity:.4}
.banner{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:8;pointer-events:none;font-size:30px;font-weight:700;color:var(--spore);text-shadow:0 0 20px rgba(242,193,78,.8),0 3px 0 #000;opacity:0}
.banner.show{animation:banner 2s ease-out}
@keyframes banner{0%{opacity:0;transform:scale(2.5)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.flashscreen{position:fixed;inset:0;background:#fff3c4;z-index:4;pointer-events:none;opacity:0}
.flashscreen.go{animation:fl .5s}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--lichen);color:var(--moss);padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.5;text-align:center;overflow-wrap:anywhere;box-shadow:0 4px 18px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;z-index:21;pointer-events:none}
.savebar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:18px}
.savebar button{padding:9px;border:1px solid var(--moss2);background:rgba(0,0,0,.15);color:var(--lichen);border-radius:10px;font:inherit;font-size:13px}
#btnReset{color:#e59a8f}
.saveinfo{text-align:center;font-size:12px;opacity:.6;margin:8px 0 20px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.7);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{width:100%;max-width:360px;background:var(--moss);border:1px solid var(--lilac);border-radius:16px;padding:18px;font-size:15px;line-height:1.6}
.modal textarea{-webkit-touch-callout:default;width:100%;height:90px;margin-top:10px;border-radius:8px;border:1px solid var(--moss2);background:rgba(0,0,0,.25);color:var(--lichen);font-size:12px;padding:8px;-webkit-user-select:text;user-select:text;word-break:break-all}
.modal .btns{display:flex;gap:8px;margin-top:14px}
.modal .btns button{flex:1;padding:11px;border-radius:10px;border:none;font:inherit;font-weight:700}
.modal .ok{background:var(--spore);color:var(--moss)}
.modal .cancel{background:transparent;color:var(--lichen);border:1px solid var(--moss2)!important}
.savebar button,.tabs button{position:relative;overflow:hidden;transition:transform .08s,background-color .15s,color .15s,box-shadow .15s}
.savebar button:active,.tabs button:active{transform:scale(.93);background-color:rgba(223,232,207,.28)}
.tabs button.on:active{background-color:#fff}
.savebar button.done{background:var(--spore);color:var(--moss);border-color:var(--spore);font-weight:700;box-shadow:0 0 14px rgba(242,193,78,.55)}
.savebar button.fail{background:#c8463a;color:#fff;border-color:#c8463a;font-weight:700}
.ripple{position:absolute;border-radius:50%;background:rgba(242,193,78,.5);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.float,.banner.show,.wrap.shake,#golden,.ripple,#shroom,body[class*="evt-"] #shroom{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="flashscreen" id="flash"></div>
<div class="banner" id="banner"></div>
<button id="golden" aria-label="金色蘑菇">🍄</button>
<div class="wrap" id="wrap">
  <div class="top">
    <div style="font-size:20px">孢子森林</div>
    <div class="count" id="count">0</div>
    <div class="rate" id="rate">每秒 0 孢子</div>
    <div class="dps"><span>即時 DPS <b id="dpsVal">0</b></span><span class="sub" id="dpsSub"></span></div>
    <div class="rate" id="dpsDetail" style="font-size:12px;opacity:.6"></div>
    <div class="seed" id="seed"></div>
    <div class="buff" id="buff"></div>
  </div>
  <div class="stage">
    <canvas id="garden"></canvas>
    <div class="evchip" id="evChip"></div>
    <button id="shroom" aria-label="點擊蘑菇收集孢子">
      <svg viewBox="0 0 200 200" width="190" height="190">
        <ellipse cx="100" cy="182" rx="60" ry="9" fill="#000" opacity=".25"/>
        <path d="M78 110 Q72 170 70 178 L130 178 Q128 170 122 110Z" fill="#efe6cf"/>
        <path d="M20 112 Q24 30 100 26 Q176 30 180 112 Q100 130 20 112Z" fill="var(--cap)"/>
        <circle cx="68" cy="70" r="12" fill="#f6ecd6"/><circle cx="118" cy="52" r="9" fill="#f6ecd6"/>
        <circle cx="145" cy="88" r="11" fill="#f6ecd6"/><circle cx="96" cy="94" r="7" fill="#f6ecd6"/>
        <ellipse cx="77" cy="154" rx="7.5" ry="4.5" fill="#ff8fa3" opacity=".55"/><ellipse cx="123" cy="154" rx="7.5" ry="4.5" fill="#ff8fa3" opacity=".55"/>
        <g id="eyes"><ellipse cx="88" cy="146" rx="4.2" ry="4.6" fill="#3a2e22"/><ellipse cx="112" cy="146" rx="4.2" ry="4.6" fill="#3a2e22"/><circle cx="89.6" cy="144.2" r="1.5" fill="#fff"/><circle cx="113.6" cy="144.2" r="1.5" fill="#fff"/></g>
        <path id="mouth" d="M92 158 Q100 164 108 158" stroke="#3a2e22" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="combo"><div class="txt" id="comboTxt"></div><div class="bar"><div class="fill" id="comboFill"></div></div></div>
  </div>
  <div class="tierchip" id="tierChip" aria-label="聚落升級進度"></div>
  <div class="tabs">
    <button class="on" data-t="gen">菌群<span class="dot" id="dotgen"></span></button>
    <button data-t="up">強化<span class="dot" id="dotup"></span></button>
    <button data-t="pre">孢子雨<span class="dot" id="dotpre"></span></button>
    <button data-t="forest">森林</button>
    <button data-t="album">圖鑑<span class="dot" id="dotalbum"></span></button>
  </div>
  <div id="panel"></div>
  <div class="savebar">
    <button id="btnSave">立即存檔</button>
    <button id="btnExport">匯出存檔碼</button>
    <button id="btnImport">匯入存檔碼</button>
    <button id="btnSound">音效：開</button>
    <button id="btnReset" style="grid-column:span 2">刪除進度</button>
  </div>
  <div class="saveinfo" id="saveinfo">讀取存檔中…</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="modal" id="modal"><div class="box"><div id="mText"></div><textarea id="mInput"></textarea><div class="btns"><button class="cancel" id="mCancel">取消</button><button class="ok" id="mOk">確定</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const GENS=[
 {n:'苔蘚地毯',i:'🌿',base:15,p:0.2},
 {n:'小香菇',i:'🍄',base:120,p:1.5},
 {n:'菌絲網路',i:'🕸️',base:1300,p:10},
 {n:'螢光菇群',i:'✨',base:14000,p:60},
 {n:'蘑菇精靈',i:'🧚',base:200000,p:400},
 {n:'古老菌王',i:'👑',base:3.3e6,p:2500},
 {n:'星際孢囊',i:'🪐',base:6e7,p:18000},
];
const UPS=[
 {id:'t1',n:'厚實菌傘',d:'點擊 ×2',c:100,f:s=>s.tapM*=2},
 {id:'g0',n:'晨露滋養',d:'苔蘚地毯 ×2',c:500,req:s=>s.g[0]>=10,f:s=>s.gm[0]*=2},
 {id:'g1',n:'椴木堆',d:'小香菇 ×2',c:3000,req:s=>s.g[1]>=10,f:s=>s.gm[1]*=2},
 {id:'t2',n:'孢子噴發',d:'點擊額外獲得 1% 每秒產量',c:8000,f:s=>s.tapPct+=0.01},
 {id:'c1',n:'敏銳菌褶',d:'暴擊率 5% → 10%',c:20000,f:s=>s.crit+=0.05},
 {id:'g2',n:'地下根脈',d:'菌絲網路 ×2',c:30000,req:s=>s.g[2]>=10,f:s=>s.gm[2]*=2},
 {id:'a1',n:'潮濕季節',d:'全部菌群 ×1.5',c:100000,f:s=>s.all*=1.5},
 {id:'k1',n:'金色菌絲',d:'金色蘑菇出現頻率提高',c:250000,f:s=>s.goldFreq*=0.6},

    ent[1].forEach(e=>{const s=popIn(e,now),x=sideX(e.b),sz=(12+e.c*8)*s;
      miniShroom(x,G+2+eb(e,now,3),sz,['#8a5a3b','#a0673f','#74492f'][Math.floor(e.a*3)],'#e9dcc0',Math.sin(t/700+e.a*6)*0.08,'open');ring(x,G-sz*0.5,e,now);
      if(Math.random()<dt*0.0005)emit(x,G-sz,'#f6ecd6')});
  }else{
    const K=Math.min(Math.max(GW/390,0.85),1.25),xmin=18*K,xmax=Math.max(xmin+30,cx-92),SZ=[0,30,32,35,35][gTier]*K;
    const xAt=c=>xmin+(xmax-xmin)*(c/2),n=Math.min(ent[1].length,12),tips=[[],[]];
    for(const R of [1,0])for(let k=0;k<n;k++){
      const [c,row]=SLOTS[k>>1];if(row!==R)continue;
      const e=ent[1][k],side=k&1,hx=side?GW-xAt(c):xAt(c),sc=row?0.78:1,hy=G+(row?-12:3)+eb(e,now,2.5);
      const tip=drawHouse(hx,hy,SZ*sc,gTier,e,t,now,dt);
      ring(hx,hy-SZ*sc*0.5,e,now);
      if(tip&&!row)tips[side].push(tip);
    }
    tips.forEach(a=>{a.sort((p,q)=>p.x-q.x);for(let i=0;i<a.length-1;i++)bunting(a[i],a[i+1])});
  }
  // 螢光菇群
  ent[3].forEach(e=>{const s=popIn(e,now),x=sideX(e.c),sz=(10+e.a*7)*s,glow=0.5+0.5*Math.sin(t/500+e.b*6);
    gx.save();gx.shadowColor=e.b<0.5?'#7ef0e0':'#d7a8ff';gx.shadowBlur=RM?8:6+glow*14;
    miniShroom(x,G+2+eb(e,now,3),sz,e.b<0.5?'#7ef0e0':'#d7a8ff','#dfe8cf',0,'sleep');gx.restore();ring(x,G-sz*0.5,e,now);
    if(Math.random()<dt*0.001)emit(x,G-sz,e.b<0.5?'#7ef0e0':'#d7a8ff')});
  // 村莊裝飾：路燈與居民
  if(gTier>=2)[cx-68,cx+68].concat(gTier>=3?[cx-44,cx+44]:[]).forEach((x,i)=>lantern(x,t,i,G));
  const ei=evI(now);
  if(ev)drawEventBack(t,now,G,dt,ei);
  drawForestDecor(t,G);drawForestWork(t,G);drawForestVisitor(t,G);drawPreparation(t,G);
  crowd().sort((a,b)=>(a.cy||0)-(b.cy||0)).forEach(w=>drawChar(w,t,dt,G));
  if(ev){
    drawEventFront(t,now,G,dt,ei);
    if(ev.id==='dance'||ev.id==='parade'){const bn=Math.floor(now/520);if(bn!==lastBeat){lastBeat=bn;sfx.kick()}}
  }
  // 蘑菇精靈
  ent[4].forEach(e=>{const s=popIn(e,now),x=cx+Math.sin(t/(1600+e.a*1400)+e.b*6.28)*(GW/2-28),y=70+Math.sin(t/(900+e.c*700)+e.a*6.28)*48;
    const flap=Math.abs(Math.sin(t/60+e.a*10));
    gx.fillStyle='rgba(223,232,207,.55)';gx.beginPath();gx.ellipse(x-5,y-2,6*s,(2+flap*4)*s,-0.5,0,7);gx.ellipse(x+5,y-2,6*s,(2+flap*4)*s,0.5,0,7);gx.fill();
    gx.save();gx.shadowColor='#fff3c4';gx.shadowBlur=12;gx.fillStyle='#fff3c4';gx.beginPath();gx.arc(x,y,3.5*s,0,7);gx.fill();gx.restore();
    ring(x,y,e,now);if(Math.random()<dt*0.004)emit(x,y+3,'#fff3c4')});
  smoke.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.gr;p.life-=p.decay;gx.fillStyle=`rgba(${p.col},${Math.max(p.life,0)*p.a})`;gx.beginPath();gx.arc(p.x,p.y,p.r,0,7);gx.fill()});
  smoke=smoke.filter(p=>p.life>0);
  // 產出的孢子
  gSpores.forEach(p=>{p.x+=p.vx;p.y+=p.vy*(fr?2:1);p.life-=0.012;gx.globalAlpha=Math.max(p.life,0);gx.fillStyle=p.c;gx.beginPath();gx.arc(p.x,p.y,1.8,0,7);gx.fill()});
  gSpores=gSpores.filter(p=>p.life>0);gx.globalAlpha=1;
  drawEvSp(dt);
  requestAnimationFrame(gardenLoop);
}
requestAnimationFrame(gardenLoop);

/* ---------- 金色蘑菇 ---------- */
let goldTimer=null,goldHide=null;
function scheduleGold(){clearTimeout(goldTimer);goldTimer=setTimeout(spawnGold,(40+Math.random()*60)*1000*D.goldFreq)}
function spawnGold(){
  const g=$('golden');g.style.left=(20+Math.random()*(innerWidth-100))+'px';g.style.top=(80+Math.random()*(innerHeight-220))+'px';
  g.style.display='block';clearTimeout(goldHide);
  goldHide=setTimeout(()=>{g.style.display='none';scheduleGold()},13000);
}
$('golden').addEventListener('pointerdown',e=>{
  e.stopPropagation();S.stats.gold++;const g=$('golden');g.style.display='none';clearTimeout(goldHide);
  burst(e.clientX,e.clientY,70,['#ffd86b','#fff3c4','#f2c14e','#b79ad9'],10,0.1);
  sfx.gold();flash();shake();navigator.vibrate&&navigator.vibrate([30,40,60]);
  const r=Math.random();
  if(r<0.45){buffMul=7;buffEnd=Date.now()+30000;banner('孢子狂潮！產量 ×7');document.body.classList.add('frenzy')}
  else if(r<0.75){tapBuff=15;tapBuffEnd=Date.now()+12000;banner('狂熱點擊！點擊 ×15')}
  else{const v=Math.max(basePps()*900,tapVal()*300);earn(v);banner('孢子寶藏 +'+fmt(v))}
  scheduleGold();hud(true);
});

/* ---------- 里程碑 ---------- */
function checkMilestone(){
  const next=Math.pow(1000,S.ms+1);
  if(S.total>=next){S.ms++;
    const names=['一千','一百萬','十億','一兆','千兆','百京'];
    banner(`累積 ${names[S.ms-1]||fmt(next)} 孢子！`);sfx.milestone();flash();
    burst(innerWidth/2,innerHeight*0.4,90,['#f2c14e','#b79ad9','#dfe8cf','#c8463a'],12,0.12);
  }
}

/* ---------- UI ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');tab=b.dataset.t;render();
});
const visibleGens=()=>GENS.map((g,i)=>i===0||S.g[i-1]>0||S.total>=g.base*0.5);
const availUps=()=>UPS.filter(u=>!S.bought.includes(u.id)&&(!u.req||u.req(S)));
function render(){
  if(tab==='album'){renderAlbum();return}
  if(tab==='forest'){renderForest();return}
  const P=$('panel');let h='';const vis=visibleGens();
  if(tab==='gen'){
    GENS.forEach((g,i)=>{
      if(!vis[i]){h+=`<div class="item locked"><div class="ico">❔</div><div class="info">繼續累積孢子來發現新菌群</div></div>`;return}
      h+=`<div class="item" id="gi${i}"><span class="ico">${g.i}</span><div class="info"><div class="name">${g.n} ×${S.g[i]}</div>每個 ${fmt(g.p*D.gm[i]*D.all*D.seedMul*workMul('idle'))}/秒</div><button data-g="${i}">${fmt(cost(i))}</button></div>`;
    });
  }else if(tab==='up'){
    const list=availUps();
    if(!list.length)h='<div class="item"><div class="info">目前沒有可買的強化。把某種菌群養到 10 隻會解鎖專屬強化。</div></div>';
    list.forEach(u=>h+=`<div class="item"><span class="ico">⬆️</span><div class="info"><div class="name">${u.n}</div>${u.d}</div><button data-u="${u.id}">${fmt(u.c)}</button></div>`);
  }else{
    const g=seedGain();
    h=`<div class="prestige">重置所有孢子、菌群與強化，換取永久的「菌種」。<br>每顆菌種讓全部產出 +10%。<br><br>目前菌種：${S.seeds}（產出 ×${D.seedMul.toFixed(1)}）<br>本輪累積：<span id="preTotal">${fmt(S.total)}</span> 孢子<br>現在重置可得：<b style="color:var(--spore)" id="preGain">${g}</b> 顆菌種<span id="preHint"><br>（本輪累積 1M 孢子後開放）</span><button id="pre" ${g<1?'disabled':''}>降下孢子雨</button></div>`;
  }
  P.innerHTML=h;refreshBtns();
}
$('panel').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.visitor){greetVisitor(b.dataset.visitor);return}
  if(b.dataset.sticker){stickerId=b.dataset.sticker;updateStickerBook();return}
  if(b.dataset.friend){albumId=b.dataset.friend;renderAlbum();$('panel').querySelector(`[data-friend="${albumId}"]`).focus({preventScroll:true});return}
  if(b.id==='friendPortrait'){
    if(performance.now()-albumReactAt<2000)return;albumReactAt=performance.now();
    const f=FRIENDS.find(f=>f.id===albumId);$('friendResponse').textContent='「'+f.line+'」';retrigger(b,'react');sfx.click();return;
  }
  const r=b.getBoundingClientRect(),bx=r.left+r.width/2,by=r.top+r.height/2;
  if(b.dataset.g!==undefined){const i=+b.dataset.g,c=cost(i);if(S.sp>=c){S.sp-=c;S.g[i]++;
    sfx.buy();burst(bx,by,14,['#f2c14e','#dfe8cf'],4);render();
    const it=$('gi'+i);if(it){retrigger(it.querySelector('.ico'),'bounce');it.classList.add('flash');setTimeout(()=>it.classList.remove('flash'),250)}
    if([10,25,50,100].includes(S.g[i])){banner(`${GENS[i].n} ×${S.g[i]}！`);sfx.milestone()}
    hud()}}
  else if(b.dataset.u){const u=UPS.find(x=>x.id===b.dataset.u);if(S.sp>=u.c){S.sp-=u.c;S.bought.push(u.id);derive();
    sfx.gold();burst(bx,by,40,['#b79ad9','#f2c14e','#fff'],7);toast('已購買：'+u.n);render();hud();scheduleGold()}}
  else if(b.id==='pre'){doPrestige()}
});
async function doPrestige(){const g=seedGain();if(g<1)return;
    if(!await ask({text:`確定要降下孢子雨？會獲得 ${g} 顆菌種，孢子、菌群與強化會重置。已完成成就、回憶、貼紙、工作、裝飾與訪客會保留；慶典準備及暫時加成會清除；未完成的本輪目標隨資源重建。`,ok:'降下孢子雨'}))return;
    const g2=seedGain();
    const forest=structuredClone(S.forest);forest.nextEvent=null;forest.preparation='none';resetTransient();
    const collection=S.collection.slice(),achievements=S.achievements.slice(),stats={...S.stats,events:S.stats.events.slice(),prestiges:S.stats.prestiges+1};S=fresh(S.seeds+g2,Math.max(S.best,S.total),S.snd,S.peak);S.collection=collection;S.achievements=achievements;S.stats=stats;S.forest=forest;derive();
    banner(`孢子雨！+${g2} 菌種`);sfx.milestone();flash();shake();
    for(let k=0;k<6;k++)setTimeout(()=>burst(Math.random()*innerWidth,-10,30,['#b79ad9','#dfe8cf','#f2c14e'],3,0.25),k*150);
    render();hud();save()}
function refreshBtns(){
  const pb=$('pre');if(pb){const g=seedGain();pb.disabled=g<1;const pg=$('preGain');if(pg)pg.textContent=g;const pt=$('preTotal');if(pt)pt.textContent=fmt(S.total);const ph=$('preHint');if(ph)ph.style.display=g<1?'':'none'}
  document.querySelectorAll('#panel button[data-g]').forEach(b=>b.disabled=S.sp<cost(+b.dataset.g));
  document.querySelectorAll('#panel button[data-u]').forEach(b=>b.disabled=S.sp<UPS.find(u=>u.id===b.dataset.u).c);
  const vis=visibleGens();
  $('dotgen').classList.toggle('show',tab!=='gen'&&GENS.some((g,i)=>vis[i]&&S.sp>=cost(i)));
  $('dotup').classList.toggle('show',tab!=='up'&&availUps().some(u=>S.sp>=u.c));
  $('dotpre').classList.toggle('show',tab!=='pre'&&seedGain()>=1);
}
let shown=0;
function hud(bump){
  syncGarden();refreshForestUI();
  const c=$('count');
  c.textContent=fmt(S.sp);
  if(bump&&!RM)retrigger(c,'pop');
  $('rate').textContent=`每秒 ${fmt(pps())} 孢子　點擊 +${fmt(tapVal())}`;
  $('seed').textContent=S.seeds?`菌種 ${S.seeds}　產出 ×${D.seedMul.toFixed(1)}`:'';
  const tn=performance.now(),W=3000;
  while(tapLog.length&&tn-tapLog[0].t>W)tapLog.shift();
  const tapDps=tapLog.reduce((a,x)=>a+x.v,0)/(W/1000);
  const cps=tapLog.length/(W/1000);
  const autoDps=pps(),total=tapDps+autoDps;
  if(total>(S.peak||0))S.peak=total;
  const dv=$('dpsVal');dv.textContent=fmt(total);
  dv.classList.toggle('hot',tapDps>autoDps&&cps>=5);
  $('dpsSub').textContent=`手速 ${cps.toFixed(1)} 下/秒`;
  $('dpsDetail').textContent=`點擊 ${fmt(tapDps)}　自動 ${fmt(autoDps)}　最高紀錄 ${fmt(S.peak||0)}`;
  refreshBtns();checkMilestone();
}
let lastUnlock=0;
setInterval(()=>{
  const now=Date.now();
  if(buffMul>1&&now>buffEnd){buffMul=1;document.body.classList.remove('frenzy');toast('孢子狂潮結束')}
  if(tapBuff>1&&now>tapBuffEnd){tapBuff=1;toast('狂熱點擊結束')}
  let bt=[];
  if(buffMul>1)bt.push(`狂潮 ×7　${Math.ceil((buffEnd-now)/1000)}s`);
  if(tapBuff>1)bt.push(`點擊 ×15　${Math.ceil((tapBuffEnd-now)/1000)}s`);
  $('buff').textContent=bt.join('　');
  if(performance.now()-lastTap>900&&combo>0)combo=Math.max(combo-1,0);
  $('comboFill').style.width=(Math.min(combo,50)*2)+'%';
  $('comboTxt').textContent=combo>=5?`連擊 ${combo}　×${comboMul().toFixed(2)}`:'';
  earn(pps()/10);hud();
  const n=visibleGens().filter(Boolean).length+availUps().length;
  if(n!==lastUnlock){lastUnlock=n;if(tab!=='album'&&tab!=='forest')render()}
},100);

/* ---------- 存檔 ---------- */
const KEY='spore-save';let loaded=false;
function setStatus(t){$('saveinfo').textContent=t}
async function rawSet(v){
  if(window.storage){try{const r=await window.storage.set(KEY,v,false);if(r)return true}catch(e){}}
  try{localStorage.setItem(KEY,v);return true}catch(e){}
  return false;
}
async function rawGet(){
  if(window.storage){try{const r=await window.storage.get(KEY,false);if(r&&r.value)return r.value}catch(e){}}
  try{const v=localStorage.getItem(KEY);if(v)return v}catch(e){}
  return null;
}
async function save(manual){
  if(!loaded)return;
  S.last=Date.now();
  const ok=await rawSet(JSON.stringify(S));
  const t=new Date().toLocaleTimeString('zh-TW',{hour12:false});
  if(ok){setStatus(`已存檔 ${t}`);if(manual){toast('存檔完成');flashBtn($('btnSave'),'已存檔 ✓')}}
  else{setStatus('此環境無法自動存檔，請用「匯出存檔碼」備份');if(manual){toast('存檔失敗，請改用匯出存檔碼');flashBtn($('btnSave'),'存檔失敗','fail')}}
}
function applySave(str,offline){
  const o=JSON.parse(str);
  if(!o||typeof o!=='object'||Array.isArray(o)||o.version!==undefined&&![1,2,3].includes(o.version))throw Error('不支援的存檔');
  const next=Object.assign(fresh(),o);
  for(const k of ['sp','total','seeds','best','last','ms','peak']){if(!Number.isFinite(next[k])||next[k]<0)throw Error('無效數值')}
  if(typeof next.snd!=='boolean'||!Array.isArray(next.g)||next.g.length>GENS.length||!next.g.every(n=>Number.isSafeInteger(n)&&n>=0))throw Error('無效菌群');
  if(!Array.isArray(next.bought)||!next.bought.every(id=>UPS.some(u=>u.id===id))||new Set(next.bought).size!==next.bought.length)throw Error('無效強化');
  if(!Array.isArray(next.collection)||!next.collection.every(id=>FRIENDS.some(f=>f.id===id)))throw Error('無效圖鑑');
  next.collection=[...new Set(next.collection)];
  if(o.version!==3){
   next.achievements=[];next.stats={combo:0,gold:0,prestiges:next.best>0?1:0,events:[]};
   if(o.version===2){
    if(!Array.isArray(o.wishes)||o.wishes.length!==3)throw Error('無效舊願望');
    let previousClaimed=true;
    o.wishes.forEach((w,i)=>{
     if(w===null){previousClaimed=false;return}
     const target=w?.path==='earn'?[300,1000,3000][i]:[3,2,2][i];
     if(!previousClaimed||!w||!next.collection.includes(FRIENDS[i].id)||!['earn','buy'].includes(w.path)||!['active','ready','claimed'].includes(w.status)||!Number.isFinite(w.progress)||w.progress<0||w.progress>target||w.path==='buy'&&!Number.isInteger(w.progress))throw Error('無效舊願望');
     if(w.status==='active'?(w.progress>=target||w.reward!==null):(w.progress!==target||w.status==='ready'&&w.reward!==null||w.status==='claimed'&&!['spores','sticker'].includes(w.reward)))throw Error('無效舊願望獎勵');
     if(w.status!=='active')next.achievements.push(MEMORIES[i].id);
     previousClaimed=w.status==='claimed';
    });
   }
  }
  if(!Array.isArray(next.achievements)||!next.achievements.every(id=>ACHIEVEMENTS.some(a=>a.id===id))||new Set(next.achievements).size!==next.achievements.length)throw Error('無效成就');
  const stats=next.stats;
  if(!stats||typeof stats!=='object'||!['combo','gold','prestiges'].every(k=>Number.isSafeInteger(stats[k])&&stats[k]>=0)||!Array.isArray(stats.events)||!stats.events.every(id=>EVENTS.some(e=>e.id===id))||new Set(stats.events).size!==stats.events.length)throw Error('無效成就紀錄');
  next.stats={combo:stats.combo,gold:stats.gold,prestiges:stats.prestiges,events:stats.events.slice()};next.version=3;delete next.wishes;
  while(next.g.length<GENS.length)next.g.push(0);
  if(o.ms===undefined)next.ms=Math.max(0,Math.floor(Math.log10(Math.max(next.total,1))/3));
  next.forest=validateForest(o.forest,next);
  resetTransient();S=next;
  derive();gTier=tierOf(S.g);
  if(offline){const sec=Math.max(0,Math.min((Date.now()-S.last)/1000,8*3600));const gain=basePps()*sec*0.5;
    if(gain>1){earn(gain);toast(`離線期間菌群收集了 ${fmt(gain)} 孢子`)}}
  soundLabel();render();hud();
}
async function load(){
  try{const v=await rawGet();if(v)applySave(v,true)}catch(e){toast('讀取存檔失敗，原存檔已保留，請匯入備份');setStatus('原存檔已保留；匯入有效備份或確認刪除進度後恢復存檔');gTierReady=true;scheduleGold();return}
  loaded=true;gTier=tierOf(S.g);gTierReady=true;save();scheduleGold();
}
function exportSave(){
  S.last=Date.now();const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  const show=()=>ask({text:'長按下方文字全選並複製，貼到記事本保存：',input:true,value:code,readonly:true,ok:'關閉',cancel:''});
  if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>{toast('存檔碼已複製到剪貼簿');flashBtn($('btnExport'),'已複製 ✓')}).catch(show);
  else show();
}
async function importSave(){
  const code=await ask({text:'貼上存檔碼（目前進度會被覆蓋）：',input:true,ok:'載入'});if(!code)return;
  try{applySave(decodeURIComponent(escape(atob(code.trim()))),false);loaded=true;save(true);toast('存檔已載入');flashBtn($('btnImport'),'已載入 ✓')}catch(e){toast('存檔碼格式錯誤，原進度已保留')}
}
function soundLabel(){$('btnSound').textContent='音效：'+(S.snd?'開':'關')}
$('btnSound').onclick=()=>{S.snd=!S.snd;soundLabel();if(S.snd)sfx.buy();const b=$('btnSound');b.classList.add('done');setTimeout(()=>b.classList.remove('done'),500);toast(S.snd?'音效已開啟':'音效已關閉');save()};
$('btnSave').onclick=()=>save(true);
$('btnExport').onclick=exportSave;
$('btnImport').onclick=importSave;
$('btnReset').onclick=async()=>{if(await ask({text:'確定要刪除全部進度（包含菌種與圖鑑收藏）？這個動作無法復原。',ok:'刪除'})){resetTransient();S=fresh(0,0,S.snd);loaded=true;derive();render();hud();save(true);flashBtn($('btnReset'),'已刪除 ✓')}};
setInterval(()=>save(false),10000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(false)});
addEventListener('pagehide',()=>save(false));
derive();render();hud();load();
</script>
